<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt-Agent</title><script src="store.js"></script><script src="js/ai.js"></script><script src="js/files.js"></script><link rel="icon" href="icon.svg">
<style>
:root{--bg:#0f1115;--panel:#161922;--panel2:#1d2130;--line:#2a3042;--text:#e8eaf0;--muted:#8b93a7;--accent:#7c8cff;--accent2:#b07cff}
@media (prefers-color-scheme:light){:root{--bg:#f6f7fb;--panel:#fff;--panel2:#eef0f7;--line:#dcdfeb;--text:#1b1e2b;--muted:#667}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif;padding:14px;max-width:760px;margin:auto}
h1{font-size:16px;margin:0 0 10px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
button,select,textarea,input{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;outline:none}
button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;font-weight:600}
textarea{width:100%;resize:vertical}textarea:focus,input:focus{border-color:var(--accent)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
label{font-size:12px;color:var(--muted)}.q{margin-top:8px}.q input{width:100%;margin-top:3px}
#out{min-height:150px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.att{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:2px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center;margin:4px 6px 0 0}.att img{height:22px;border-radius:4px}.att b{cursor:pointer;font-weight:400;color:var(--muted)}.drop{outline:2px dashed var(--accent)}
.st{color:var(--muted);font-size:12px;margin-top:6px}#hist button{display:block;width:100%;text-align:left;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
</style></head><body>
<h1>🪄 Prompt-Agent</h1>
<div class="box">
  <label>Was möchtest du erreichen?</label>
  <textarea id="goal" rows="3" placeholder="z. B. „Ich will eine Webseite für mein Café“ oder „Ein Logo für meine Firma“"></textarea>
  <div class="row">
    <select id="target">
      <option value="chat">💬 Chat-KI (ChatGPT, Claude, Gemini …)</option>
      <option value="code">🧩 Code / Web-App bauen</option>
      <option value="image">🎨 Bild (Midjourney, Flux, DALL·E …)</option>
      <option value="text">✍️ Text schreiben</option>
      <option value="research">🔎 Recherche / Analyse</option>
      <option value="media">🎬 Video / 🎵 Musik</option>
    </select>
    <button id="attach" title="Bilder, PDFs oder Textdateien als Vorlage/Kontext anhängen">📎 Anhang</button><input type="file" id="file" multiple hidden accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.yml,.yaml,.log,.java,.c,.cpp,.go,.rs,.sql">
    <label><input type="checkbox" id="ask" checked style="padding:0"> Rückfragen stellen</label>
    <button class="primary" id="go">Prompt erstellen</button>
  </div>
  <div id="atts"></div><div id="qs"></div><div class="st" id="st"></div>
</div>
<div class="box" id="res" style="display:none">
  <label>Dein fertiger Prompt (editierbar)</label>
  <textarea id="out" rows="9"></textarea>
  <div class="row">
    <button id="copy" class="primary">Kopieren</button>
    <button id="send">An Haupt-App senden ↗</button>
    <button data-m="Mach den Prompt deutlich kürzer und präziser.">Kürzer</button>
    <button data-m="Mach den Prompt ausführlicher mit mehr Kontext, Beispielen und klaren Qualitätskriterien.">Detaillierter</button>
  </div>
  <div class="row"><input id="fb" placeholder="Änderungswunsch, z. B. „formeller“, „für Anfänger“ …" style="flex:1"><button id="fbGo">Anpassen</button></div>
</div>
<div class="box"><label>Verlauf</label><div id="hist"></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S={model:(LS.get("aio",{}).model)||"openai-fast"},toast=t=>st(t);
fetch("https://text.pollinations.ai/models").then(r=>r.json()).then(l=>{const info={};l.forEach(x=>{[x.name,...(x.aliases||[])].forEach(n=>info[n]=x)});window.AIO_MODEL_INFO=info;window.AIO_MODELS=l.map(x=>x.name);if(!info[S.model])S.model=l[0].name}).catch(()=>{});
/** KI-Aufruf des Agenten über die gemeinsame Schicht (Timeout, Wiederholung, „Denkt nach“-Anzeige) */
const agent=(system,user,onTok)=>ask([{role:"system",content:system},{role:"user",content:user}],onTok||(()=>{}),undefined,undefined,()=>st("💭 Der Agent denkt nach …"));
const HINT={
 chat:"Zielsystem: Chat-KI. Struktur: Rolle, Kontext, Aufgabe, Schritte/Vorgehen, Format der Antwort, Einschränkungen. Antwortsprache wie die Eingabe.",
 code:"Zielsystem: KI zum Programmieren/Bauen von Apps. Nenne Technologie, Features (Liste), Design/Stil, Verhalten bei Fehlern, Dateistruktur und fordere vollständigen, lauffähigen Code in einer Datei.",
 image:"Zielsystem: Bildgenerator. Schreibe den Prompt auf ENGLISCH als dichte Beschreibung: Motiv, Stil/Medium, Komposition, Licht, Farben, Stimmung, Kameradetails, Qualitätswörter. Max. ca. 80 Wörter, optional Seitenverhältnis am Ende.",
 text:"Zielsystem: KI zum Schreiben. Lege Zielgruppe, Ton, Länge, Struktur, Stil und Beispiele/Don'ts fest.",
 research:"Zielsystem: Recherche/Analyse. Fordere Quellen, Gegenargumente, Unsicherheiten, strukturierte Tabelle/Zusammenfassung und Fazit.",
 media:"Zielsystem: Video-/Musik-KI. Szenen/Stimmung, Stil, Tempo, Instrumente/Kamerabewegung, Dauer. Bei Musik: Genre, BPM, Instrumente, Gesangsstil. Auf ENGLISCH."};
const SYS="Du bist ein erstklassiger Prompt-Engineer. Du verwandelst vage Wünsche in präzise, sofort nutzbare Prompts. ";
let hist=LS.get("aioPrompts",[]);
function drawHist(){$("#hist").innerHTML=hist.length?hist.map((h,i)=>`<button data-i="${i}">${esc(h.goal.slice(0,60))}</button>`).join(""):'<span class="st">Noch nichts erstellt.</span>'}
$("#hist").onclick=e=>{const b=e.target.closest("[data-i]");if(!b)return;const h=hist[+b.dataset.i];$("#goal").value=h.goal;$("#target").value=h.target;show(h.prompt)};
function show(t){$("#res").style.display="";$("#out").value=t}
const st=t=>$("#st").textContent=t||"";
let pending=null,atts=[];
const ATT_HINT=" Der Nutzer hat Dateien und/oder Bilder angehängt. Werte sie aus und baue die relevanten Details (Inhalt, Struktur, Stil, Farben, Komposition, Daten) konkret in den Prompt ein. Bei Referenzbildern beschreibe den Stil genau, damit der Prompt auch ohne das Bild funktioniert.";
const sysFor=base=>base+(atts.length?ATT_HINT:"");
function userContent(text){
  const docs=atts.filter(a=>a.text!=null).map(a=>`\n\n[Datei: ${a.name}]\n${a.text.slice(0,15000)}${a.text.length>15000?"\n…(gekürzt)":""}`).join(""),imgs=atts.filter(a=>a.img);
  return imgs.length?[{type:"text",text:text+docs},...imgs.map(a=>({type:"image_url",image_url:{url:a.img}}))]:text+docs}
const drawAtts=()=>{$("#atts").innerHTML=atts.map((a,i)=>`<span class="att">${a.img?`<img src="${a.img}">`:"📄"} ${esc(a.name)}<b data-rm="${i}">✕</b></span>`).join("")};
$("#atts").onclick=e=>{const r=e.target.closest("[data-rm]");if(r){atts.splice(+r.dataset.rm,1);drawAtts()}};
async function addFiles(list){for(const f of list){try{st("Lese "+f.name+" …");atts.push(await readAttachment(f))}catch{st("⚠️ Konnte "+f.name+" nicht lesen")}}drawAtts();st("")}
$("#attach").onclick=()=>$("#file").click();
$("#file").onchange=e=>{addFiles([...e.target.files]);e.target.value=""};
document.addEventListener("paste",e=>{const f=[...(e.clipboardData?.files||[])];if(f.length){e.preventDefault();addFiles(f)}});
document.addEventListener("dragover",e=>{e.preventDefault();document.body.classList.add("drop")});
document.addEventListener("dragleave",e=>{if(!e.relatedTarget)document.body.classList.remove("drop")});
document.addEventListener("drop",e=>{e.preventDefault();document.body.classList.remove("drop");addFiles([...e.dataTransfer.files])});
async function run(){
  const goal=$("#goal").value.trim()||(atts.length?"Erstelle auf Basis der Anhänge einen passenden Prompt.":"");if(!goal)return;const target=$("#target").value;$("#go").disabled=true;$("#qs").innerHTML="";st("Der Agent denkt nach …");
  try{
    if($("#ask").checked&&!pending){
      const raw=await agent(sysFor(SYS)+'Prüfe, ob für einen wirklich guten Prompt wichtige Infos fehlen. Antworte NUR mit JSON: {"questions":["…"]} mit 0–3 kurzen, konkreten Rückfragen (leer, wenn genug Infos). '+HINT[target],userContent(goal));
      let qs=[];try{qs=JSON.parse(raw.match(/\{[\s\S]*\}/)[0]).questions||[]}catch{}
      if(qs.length){pending={goal,target,qs};$("#qs").innerHTML=qs.slice(0,3).map((q,i)=>`<div class="q"><label>${esc(q)}</label><input data-q="${i}" placeholder="(optional)"></div>`).join("")+'<div class="row"><button class="primary" id="qgo">Weiter</button><button id="qskip">Überspringen</button></div>';
        $("#qgo").onclick=()=>finish(true);$("#qskip").onclick=()=>finish(false);st("Ein paar Rückfragen für ein besseres Ergebnis:");return}}
    await gen(goal,target,"")
  }catch(e){st("⚠️ "+e.message)}finally{$("#go").disabled=false}}
async function finish(useAns){
  const p=pending;pending=null;const ans=useAns?[...document.querySelectorAll("[data-q]")].map(i=>i.value.trim()?`- ${p.qs[+i.dataset.q]} → ${i.value.trim()}`:"").filter(Boolean).join("\n"):"";
  $("#qs").innerHTML="";try{await gen(p.goal,p.target,ans)}catch(e){st("⚠️ "+e.message)}}
async function gen(goal,target,ans){
  st("Erstelle Prompt …");show("");
  const t=await agent(sysFor(SYS)+HINT[target]+" Gib AUSSCHLIESSLICH den fertigen Prompt aus – ohne Einleitung, ohne Erklärung, ohne Anführungszeichen drumherum. Platzhalter in [eckigen Klammern], wo der Nutzer noch etwas einsetzen muss.",
    userContent("Wunsch des Nutzers:\n"+goal+(ans?"\n\nZusätzliche Angaben:\n"+ans:"")),x=>$("#out").value=x);
  hist.unshift({goal,target,prompt:t});hist=hist.slice(0,15);LS.set("aioPrompts",hist);drawHist();st(atts.length?"Fertig ✔ – Bilder/Dateien musst du beim Ziel-Tool selbst wieder anhängen.":"Fertig ✔")}
async function refine(m){
  const cur=$("#out").value;if(!cur)return;st("Passe an …");
  try{await agent(SYS+HINT[$("#target").value]+" Überarbeite den gegebenen Prompt gemäß Anweisung. Gib AUSSCHLIESSLICH den neuen Prompt aus.","Aktueller Prompt:\n"+cur+"\n\nAnweisung: "+m,x=>$("#out").value=x);st("Fertig ✔")}catch(e){st("⚠️ "+e.message)}}
$("#go").onclick=()=>{pending=null;run()};
$("#goal").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){pending=null;run()}});
$("#copy").onclick=()=>navigator.clipboard.writeText($("#out").value).then(()=>st("Kopiert ✔"));
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>refine(b.dataset.m));
$("#fbGo").onclick=()=>{const v=$("#fb").value.trim();if(v){refine(v);$("#fb").value=""}};
$("#send").onclick=()=>{const msg={type:"aio-prompt",text:$("#out").value,target:$("#target").value};
  if(window.opener&&!window.opener.closed){window.opener.postMessage(msg,location.protocol==="file:"?"*":location.origin);window.opener.focus();st("An Haupt-App gesendet ✔")}else{navigator.clipboard.writeText(msg.text);st("Haupt-App nicht offen – Prompt kopiert")}};
drawHist();
</script></body></html>
