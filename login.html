<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MERCYVERSE – Anmelden</title>
<link rel="icon" href="/icon.svg"><meta name="theme-color" content="#050a12">
<link rel="stylesheet" href="/css/theme.css"><link rel="stylesheet" href="/css/pages.css">
</head><body>
<div class="wrap">
  <div class="brand"><h1>Mercyverse</h1><small>All-in-One KI</small></div>

  <form class="card2" id="fLogin" autocomplete="on">
    <h2>Anmelden</h2><p class="sub">Melde dich mit deinem Konto an.</p>
    <label for="name">Benutzername</label><input id="name" name="username" autocomplete="username" autofocus required>
    <label for="pw">Passwort</label><input id="pw" name="password" type="password" autocomplete="current-password" required>
    <div class="row2"><button class="primary" id="go" style="width:100%">Anmelden</button></div>
    <div class="msg2" id="m1" role="alert"></div>
  </form>

  <form class="card2" id="fChange" style="display:none" autocomplete="off">
    <h2>Neues Passwort festlegen</h2><p class="sub" id="chInfo">Aus Sicherheitsgründen musst du jetzt ein eigenes Passwort wählen (mindestens 8 Zeichen).</p>
    <label for="np1">Neues Passwort</label><input id="np1" type="password" autocomplete="new-password" required>
    <label for="np2">Neues Passwort wiederholen</label><input id="np2" type="password" autocomplete="new-password" required>
    <div class="row2"><button class="primary" style="width:100%">Passwort speichern</button></div>
    <div class="msg2" id="m2" role="alert"></div>
  </form>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const next=(()=>{const n=new URLSearchParams(location.search).get("next")||"/";return /^\/(?!\/)[A-Za-z0-9_\-./]*$/.test(n)&&!/login/.test(n)?n:"/"})();
let curPw="";
async function api(method,url,body){
  try{const r=await fetch(url,{method,headers:{"Content-Type":"application/json","X-AIO":"1"},body:body?JSON.stringify(body):undefined});
    let d={};try{d=await r.json()}catch{}return{status:r.status,data:d}}
  catch{return{status:0,data:{error:"Server nicht erreichbar."}}}}
function showChange(){$("#fLogin").style.display="none";$("#fChange").style.display="";$("#np1").focus()}
(async()=>{ // schon angemeldet?
  const r=await api("GET","/api/me");
  if(r.status===200){if(r.data.user.must_change){showChange();$("#chInfo").textContent+=" Dein bisheriges Passwort brauchst du dafür noch einmal.";
      $("#fChange").insertAdjacentHTML("afterbegin",'<label for="cur">Bisheriges Passwort</label><input id="cur" type="password" autocomplete="current-password" required>')}
    else location.replace(next)}})();
$("#fLogin").onsubmit=async e=>{e.preventDefault();$("#m1").textContent="";$("#go").disabled=true;
  const r=await api("POST","/api/login",{name:$("#name").value,password:$("#pw").value});$("#go").disabled=false;
  if(r.status!==200){$("#m1").className="msg2 err";$("#m1").textContent=r.data.error||"Anmeldung fehlgeschlagen.";return}
  curPw=$("#pw").value;
  if(r.data.user.must_change)showChange();else location.replace(next)};
$("#fChange").onsubmit=async e=>{e.preventDefault();const m=$("#m2");m.className="msg2";m.textContent="";
  if($("#np1").value!==$("#np2").value){m.className="msg2 err";m.textContent="Die Passwörter stimmen nicht überein.";return}
  const cur=curPw||($("#cur")&&$("#cur").value)||"";
  const r=await api("POST","/api/me/password",{current:cur,new:$("#np1").value});
  if(r.status!==200){m.className="msg2 err";m.textContent=r.data.error||"Fehler beim Speichern.";return}
  location.replace(next)};
</script></body></html>
