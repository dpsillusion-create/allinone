# Start:  docker compose up -d --build
# Aufruf: http://<server-ip>:8080      Daten liegen im Ordner ./data (Backup = diesen Ordner kopieren)
# Erster Start: Admin-Konto "admin" mit Start-Passwort im Log:  docker compose logs allinone
#   (oder selbst festlegen:  AIO_ADMIN_PASSWORD=meinpasswort docker compose up -d --build)
# Admin-Passwort vergessen:  docker compose exec allinone python3 server.py --reset-admin-password
# Mit HTTPS (Mikrofon, Zwischenablage, App-Installation):
#   AIO_HOST=<server-ip> docker compose --profile https up -d --build   ->  https://<server-ip>:8443
services:
  allinone:
    build: .
    container_name: allinone
    restart: unless-stopped
    environment:
      AIO_ADMIN_PASSWORD: ${AIO_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data

  allinone-https:
    profiles: ["https"]
    image: caddy:2-alpine
    container_name: allinone-https
    restart: unless-stopped
    depends_on: [allinone]
    environment:
      AIO_HOST: ${AIO_HOST:-localhost}
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
